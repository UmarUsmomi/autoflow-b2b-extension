name: AutoFlow CI and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: autoflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension and worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read Node version
        id: node-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Offline tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Package extension
        run: npm run package
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: autoflow-b2b-extension
          path: autoflow-b2b-extension.zip
          if-no-files-found: error

  release:
    name: Attach package to tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: autoflow-b2b-extension
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/autoflow-b2b-extension.zip --title "AutoFlow B2B Copilot ${GITHUB_REF_NAME}" --generate-notes
